</style></head><body>
<header><div class="hd"><div class="logo">✍️</div><div class="tt"><h1>IELTS Writing Coach</h1><div class="mut">Học viết Task 1 &amp; 2 cùng AI</div></div><div class="hr"><button id="th" class="chip" onclick="cycTh()"></button><select id="gb" class="chip"><option value="6.0">🎯 Band 6.0</option><option value="6.5">🎯 Band 6.5</option><option value="7.0">🎯 Band 7.0</option></select></div></div><nav id="nav"></nav></header><main id="m"></main>
<script>
(async function(){
const SB_URL='https://rfjfvmfizpdiihbwioda.supabase.co';
const SB_KEY='sb_publishable_oyEE1nISN12BDSJgEOcYxw_g1P1Ui7I';
const HD={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
const S='ielts_session',C='ielts_cache_users';
const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

async function sb(path,opt={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opt,headers:{...HD,...(opt.headers||{})}});
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
async function H(p,salt){const d=salt+':'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of d)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
const rid=()=>Math.random().toString(36).slice(2,10),NM=/^[a-z0-9_.]{3,20}$/;

const Auth=window.Auth={
  users:()=>J(C,[]),
  async sync(){
    try{const rows=await sb('app_users?select=*&order=created.asc');if(rows){W(C,rows);return rows}}catch(e){}
    return J(C,[]);
  },
  async saveUser(u){
    const l=Auth.users(),i=l.findIndex(x=>x.id==u.id);
    if(i>=0)l[i]=u;else l.push(u);W(C,l);
    await sb('app_users',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(u)});
  },
  async delUser(id){
    W(C,Auth.users().filter(x=>x.id!=id));
    await sb('app_users?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
  },
  me:null
};

async function mk(name,pw,role){const salt=rid()+rid();return{id:rid(),name,salt,h:await H(pw,salt),role,locked:false,created:Date.now(),last:null,data:{}}}

let us=await Auth.sync();
if(!us.length){
  const defAdmin=await mk('admin','admin123','admin');
  await Auth.saveUser(defAdmin);
  us=[defAdmin];
}

const sid=localStorage.getItem(S);
Auth.me=us.find(u=>u.id==sid&&!u.locked)||null;
window.__P=Auth.me?'u'+Auth.me.id+':':'';

if(Auth.me&&Auth.me.data){
  Object.entries(Auth.me.data).forEach(([k,v])=>{
    if(v!==undefined&&v!==null)localStorage.setItem(window.__P+k,JSON.stringify(v));
  });
}

let syncTimer=null;
const origSet=Storage.prototype.setItem;
Storage.prototype.setItem=function(k,v){
  origSet.call(this,k,v);
  if(Auth.me&&window.__P&&k.startsWith(window.__P)){
    const shortKey=k.slice(window.__P.length);
    if(['band','cfg2','vocab','vstat'].includes(shortKey)){
      Auth.me.data=Auth.me.data||{};
      try{Auth.me.data[shortKey]=JSON.parse(v)}catch(e){Auth.me.data[shortKey]=v}
      clearTimeout(syncTimer);
      syncTimer=setTimeout(()=>Auth.saveUser(Auth.me).catch(()=>{}),1000);
    }
  }
};

window.logout=()=>{localStorage.removeItem(S);location.reload()};
window.userMenu=async()=>{
  const c=prompt('Tài khoản: '+Auth.me.name+'\n1 = Đăng xuất\n2 = Đổi mật khẩu');
  if(c=='1')logout();
  if(c=='2'){
    const p=prompt('Mật khẩu mới (≥6 ký tự):');
    if(p&&p.length>=6){
      Auth.me.salt=rid()+rid();Auth.me.h=await H(p,Auth.me.salt);
      await Auth.saveUser(Auth.me);alert('Đã đổi mật khẩu trên máy chủ');
    }else if(p)alert('Mật khẩu quá ngắn');
  }
};

window.adm=async(a,id)=>{
  const l=await Auth.sync(),u=l.find(x=>x.id==id),m=document.getElementById('am');
  if(a=='add'){
    const n=document.getElementById('an').value.trim().toLowerCase(),p=document.getElementById('ap').value;
    if(!NM.test(n)||p.length<6){m.textContent='Tên 3–20 ký tự (a-z, 0-9, _ .) và mật khẩu ≥ 6 ký tự.';return}
    if(l.some(x=>x.name==n)){m.textContent='Tên đã tồn tại.';return}
    await Auth.saveUser(await mk(n,p,'user'));
  }
  else if(!u||id==Auth.me.id)return;
  else if(a=='pw'){const p=prompt('Mật khẩu mới cho '+u.name+' (≥6 ký tự):');if(!p||p.length<6)return;u.salt=rid()+rid();u.h=await H(p,u.salt);await Auth.saveUser(u)}
  else if(a=='lock'){u.locked=!u.locked;await Auth.saveUser(u)}
  else if(a=='role'){u.role=u.role=='admin'?'user':'admin';await Auth.saveUser(u)}
  else if(a=='del'){if(!confirm('Xóa tài khoản '+u.name+' khỏi máy chủ?'))return;await Auth.delUser(id)}
  adminPanel();
};

window.adminPanel=async function(){
  document.getElementById('m').innerHTML='<div class="card mut">Đang tải danh sách tài khoản từ Supabase…</div>';
  const us=await Auth.sync(),f=t=>t?new Date(t).toLocaleString('vi-VN'):'—';
  document.getElementById('m').innerHTML=`<div class="card"><h3>👑 Quản lý tài khoản (${us.length})</h3><div class="row"><input id="an" placeholder="Tên đăng nhập" autocapitalize="none" style="flex:1;min-width:130px"><input id="ap" type="password" placeholder="Mật khẩu (≥6)" style="flex:1;min-width:130px"><button class="btn" onclick="adm('add')">➕ Tạo</button></div><div id="am" class="mut">Tài khoản được lưu tập trung trên Supabase.</div></div>`+us.map(u=>`<div class="card"><b>${esc(u.name)}</b> ${u.role=='admin'?'👑 admin':''} ${u.locked?'🔒 đã khóa':''}<div class="mut">Tạo: ${f(u.created)} · Đăng nhập gần nhất: ${f(u.last)} · ${(u.data&&u.data.vocab?u.data.vocab.length:0)} từ vựng</div>${u.id==Auth.me.id?'<div class="mut">(Tài khoản của bạn)</div>':`<div class="row" style="margin-top:8px"><button class="btn s" onclick="adm('pw','${u.id}')">🔑 Đổi mật khẩu</button><button class="btn s" onclick="adm('lock','${u.id}')">${u.locked?'🔓 Mở khóa':'🔒 Khóa'}</button><button class="btn s" onclick="adm('role','${u.id}')">${u.role=='admin'?'⬇️ Hạ xuống user':'⬆️ Lên admin'}</button><button class="btn s" onclick="adm('del','${u.id}')">🗑️ Xóa</button></div>`}</div>`).join('');
};

const bootApp=()=>{const e=document.createElement('script');e.textContent=document.getElementById('app').textContent;document.body.appendChild(e)};
if(Auth.me){
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootApp);else bootApp();
  return;
}

window.__HALT=true;
const showLogin=()=>{
  document.querySelector('header').style.display='none';document.getElementById('m').style.display='none';
  let mode='in';const o=document.createElement('div');o.className='au';document.body.appendChild(o);
  const draw=()=>{
    const T={in:'🔐 Đăng nhập',reg:'📝 Tạo tài khoản'}[mode];
    o.innerHTML=`<div class="card"><div class="logo" style="margin:0 auto 8px">✍️</div><h3 style="text-align:center;margin:0">${T}</h3><input id="aun" placeholder="Tên đăng nhập" autocomplete="username" autocapitalize="none"><input id="apw" type="password" placeholder="Mật khẩu" autocomplete="${mode=='in'?'current-password':'new-password'}">${mode!='in'?'<input id="apw2" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password">':''}<div id="aer" class="err" style="margin:8px 0;min-height:20px"></div><button class="btn" id="ago" style="width:100%">${mode=='in'?'Đăng nhập':'Tạo tài khoản'}</button><p class="mut" style="text-align:center;margin-bottom:0">${mode=='in'?'Chưa có tài khoản? <a id="asw">Đăng ký</a>':'Đã có tài khoản? <a id="asw">Đăng nhập</a>'}</p></div>`;
    const E=t=>document.getElementById('aer').textContent=t,go=async()=>{
      const btn=document.getElementById('ago');btn.disabled=true;E('Đang kiểm tra…');
      try{
        const n=document.getElementById('aun').value.trim().toLowerCase(),p=document.getElementById('apw').value,l=await Auth.sync();
        if(!NM.test(n)){btn.disabled=false;return E('Tên đăng nhập 3–20 ký tự: chữ thường, số, _ hoặc .')}
        if(mode=='in'){
          const u=l.find(x=>x.name==n);
          if(!u||u.h!=await H(p,u.salt)){btn.disabled=false;return E('Sai tên đăng nhập hoặc mật khẩu.')}
          if(u.locked){btn.disabled=false;return E('Tài khoản đã bị khóa. Liên hệ admin.')}
          u.last=Date.now();await Auth.saveUser(u);localStorage.setItem(S,u.id);return location.reload();
        }
        if(p.length<6){btn.disabled=false;return E('Mật khẩu tối thiểu 6 ký tự.')}
        if(p!=document.getElementById('apw2').value){btn.disabled=false;return E('Hai mật khẩu không khớp.')}
        if(l.some(x=>x.name==n)){btn.disabled=false;return E('Tên đăng nhập đã tồn tại.')}
        const u=await mk(n,p,'user');u.last=Date.now();
        await Auth.saveUser(u);localStorage.setItem(S,u.id);location.reload();
      }catch(err){btn.disabled=false;E('Lỗi kết nối máy chủ: '+err.message)}
    };
    document.getElementById('ago').onclick=go;o.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)go()});
    document.getElementById('asw').onclick=()=>{mode=mode=='in'?'reg':'in';draw()};
  };draw();
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',showLogin);else showLogin();
})();
</script>
<script type="text/plain" id="app">
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/^#+\s*(.+)$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^- /gm,'• ');
const GK=k=>k=='theme'?k:(window.__P||'')+k;const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(GK(k)));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(GK(k),JSON.stringify(v))}catch(e){}}};
let sample=null;try{typeof claude!='undefined'&&claude.use('sample').then(s=>{sample=s}).catch(()=>{})}catch(e){}
const SYS="Bạn là giáo viên IELTS Writing giàu kinh nghiệm cho học sinh Việt Nam. Giải thích bằng tiếng Việt ngắn gọn, ví dụ và câu mẫu bằng tiếng Anh. Dùng ## cho tiêu đề, **đậm** cho ý quan trọng, '- ' cho gạch đầu dòng. ";
const T_BASE=[{n:'Opinion (Agree/Disagree)',k:'To what extent do you agree/disagree? What is your opinion?',s:'Chọn 1 trong 3: đồng ý / không đồng ý / đồng ý một phần (nói rõ phần nào). Mở bài nêu lập trường + 2 lý do.',
t:[['Mở bài','It is often argued that [CLAIM]. I [completely agree / disagree / partly agree] with this view because [REASON 1] and [REASON 2].'],['Thân bài 1','The first reason is that [REASON 1]. This is important because [EXPLANATION]. For example, [EXAMPLE]. Therefore, [LINK TO QUESTION].'],['Thân bài 2','Another reason is that [REASON 2]. If [CONDITION], [GROUP] are more likely to [RESULT]. This can be seen in [EXAMPLE]. For this reason, I believe [CLAIM] is reasonable.'],['Kết bài','In conclusion, I [position] that [CLAIM], mainly because [REASON 1] and [REASON 2].'],['Đồng ý một phần (mở bài)','I agree with this view to some extent. While [PART YOU AGREE WITH] is true in certain situations, I believe [LIMITATION].']]},
{n:'Discussion (both views)',k:'Discuss both views and give your opinion.',s:'Body 1: view bạn ít đồng ý. Body 2: view bạn đồng ý + lý do. Nêu opinion ngay mở bài và nhắc lại ở kết bài.',

function vup(i,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,260/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);V[i].img=c.toDataURL('image/jpeg',.72);saveV();vlist()};im.src=r.result};r.readAsDataURL(f)}

let G={};
function gstart(k,all){const f=$('#fl');clearInterval(G.tm);let pool=k=='sr'&&!all?dueW():V.slice();

 if(!pool.length){f.innerHTML=k=='sr'?'<div class="card ok">🎉 Hôm nay không còn từ cần ôn.</div><button class="btn s" onclick="gstart(\'sr\',1)">Ôn thêm tất cả</button>':'<div class="card err">Chưa có từ phù hợp (điền chỗ trống cần từ có câu ví dụ chứa chính từ đó).</div>';return}
 G={k,s:0,w:0,i:0,t0:Date.now(),q:k=='sp'?shuf(pool).concat(shuf(pool),shuf(pool),shuf(pool)):shuf(pool).slice(0,k=='mt'?5:10)};
 if(k=='sp'){G.end=Date.now()+6e4;G.tm=setInterval(()=>{const e=$('#gt');if(!e){clearInterval(G.tm);return}const r=Math.ceil((G.end-Date.now())/1000);e.textContent='⏱ '+Math.max(0,r)+'s';if(r<=0)gend()},400)}

function gnext(){const f=$('#fl'),g=G;if(g.done)return;if(g.k=='sp'&&Date.now()>=g.end)return gend();if(g.i>=g.q.length)return gend();const v=g.q[g.i];

function vimp(){const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/plain;charset=utf-8'}));a.download=n;a.click()};
 $('#vf').onchange=async e=>{const f=e.target.files[0];if(f)$('#vt').value=await f.text()};
 $('#vi').onclick=()=>{const L=parseV($('#vt').value);let n=0,d=0;L.forEach(o=>{if(hasW(o.word)){d++;return}V.unshift(Object.assign({pos:'',ipa:'',vi:'',example:'',example_vi:'',synonyms:[],collocations:[]},o));n++});saveV();vlist();$('#vim').innerHTML='<span class="ok">✓ Đã thêm '+n+' từ</span>'+(d?', bỏ qua '+d+' từ trùng':'')+(V.some(v=>!v.vi)?'. Còn từ chưa có nghĩa: bấm “🤖 AI điền”.':'')};
 $('#vai').onclick=async e=>{const L=V.filter(v=>!v.vi);if(!L.length){$('#vim').textContent='Không có từ nào thiếu nghĩa.';return}e.target.disabled=true;let done=0;
  try{for(let i=0;i<L.length;i+=8){const part=L.slice(i,i+8);$('#vim').textContent='AI đang điền '+(i+1)+'–'+(i+part.length)+' / '+L.length+'…';
   const r=await aiJ('Điền thông tin cho các từ IELTS sau: '+JSON.stringify(part.map(v=>v.word))+'. Trả về CHỈ JSON mảng cùng thứ tự, mỗi phần tử {"word":"","ipa":"IPA","pos":"loại từ","vi":"nghĩa tiếng Việt ngắn","example":"1 câu ví dụ kiểu IELTS Writing","example_vi":"dịch câu ví dụ","synonyms":["3-4 từ đồng nghĩa"],"collocations":["2-3 collocation"],"emoji":"1-2 emoji minh họa nghĩa","tip":"mẹo nhớ ngắn bằng tiếng Việt"}');
   r.forEach((x,j)=>{const v=part.find(y=>String(y.word).toLowerCase()==String(x.word).toLowerCase())||part[j];if(v){Object.keys(x).forEach(k=>{if(k!='word'&&x[k]&&(!v[k]||(Array.isArray(v[k])&&!v[k].length)))v[k]=x[k]});done++}});saveV();vlist()}
   $('#vim').innerHTML='<span class="ok">✓ Đã điền '+done+' từ</span>'}catch(x){$('#vim').innerHTML='<span class="err">'+esc(em(x))+'</span> (đã điền '+done+' từ)'}e.target.disabled=false};
 $('#vdl').onclick=()=>dl('mau-tu-vung.txt','# Mỗi dòng 1 từ: từ | loại từ | nghĩa | ví dụ\n# Chỉ cần từ + nghĩa cũng được; chỉ có từ thì bấm "AI điền"\noutweigh | verb | quan trọng hơn | The benefits outweigh the drawbacks.\nmitigate | verb | giảm nhẹ | Trees help mitigate air pollution.\nsustainable | adj | bền vững\ncurriculum\n');
 $('#vex').onclick=()=>dl('so-tu-vung.txt',V.map(v=>[v.word,v.pos||'',v.vi||'',v.example||''].join(' | ')).join('\n'))}
function useP(i){SVGH='';DRAFT={p:TOP[tp][i],e:'',m:'2',t:''};go('wr')}
function addVB(){const L=(VB[tp]||[]).map(s=>{const [w,pos,vi,ex]=s.split('|');return{word:w,pos,ipa:'',vi,example:ex,example_vi:'',synonyms:[],collocations:[]}});let n=0;L.forEach(x=>{if(!hasW(x.word)){V.unshift(x);n++}});saveV();return n}
async function topV(b){b.disabled=true;try{const r=await aiJ('Chủ đề IELTS "'+tp+'", mục tiêu band '+BAND+'. Trả về CHỈ JSON mảng 8 phần tử, mỗi phần tử {"word":"","ipa":"","pos":"","vi":"","example":"","example_vi":"","synonyms":[],"collocations":[]}: từ/collocation hữu ích cho Writing chủ đề này.');let n=0;r.forEach(x=>{if(x&&x.word&&!hasW(x.word)){V.unshift(x);n++}});saveV();b.textContent='✓ AI đã thêm '+n+' từ vào tab Từ vựng'}catch(e){b.textContent='Lỗi: '+em(e).slice(0,60)}b.disabled=false}
function ideas(){const [a,b,c,d,e]=(IDX[tp]||'').split(' | ');
 $('#m').innerHTML=`<div class="card"><h3>🧠 Cách lên ý tưởng trong 2–3 phút</h3><b>1.</b> Gạch chân từ khóa + xác định dạng bài (cần mấy câu trả lời?).<br><b>2.</b> Hỏi 4 câu: <i>Ai</i> bị ảnh hưởng? Ảnh hưởng <i>tiền / thời gian / sức khỏe / giáo dục / môi trường / công bằng</i> thế nào? Làm <i>quá mức</i> thì xấu gì? <i>Ai</i> giải quyết (government, schools, companies, parents, individuals)?<br><b>3.</b> Kỹ thuật “Why ×3”: hỏi “vì sao?” 3 lần để từ ý chung thành ý sâu.<br><b>4.</b> Chọn 2 ý mạnh nhất, KHÔNG trùng nhau; mỗi ý theo P-E-E-L với ví dụ đời thường cụ thể.<br><b>5.</b> Bí ý: dùng hướng “ngắn hạn vs dài hạn”, “cá nhân vs xã hội”, “thành phố vs nông thôn”.</div>
<div class="row" style="margin-bottom:10px">${Object.keys(TOP).map(k=>`<button class="chip ${k==tp?'on':''}" onclick="tp=this.dataset.k;ideas()" data-k="${esc(k)}">${esc(k)} (${TOP[k].length})</button>`).join('')}</div>
<div class="card"><h3>${esc(tp)}: ý tưởng</h3><b>Lợi ích / nguyên nhân:</b> ${esc(a)}<br><b>Bất lợi / hậu quả / vấn đề:</b> ${esc(b)}<br><b>Giải pháp (ai làm?):</b> ${esc(c)}<br><b>Ví dụ cụ thể dùng được:</b> ${esc(d)}<br><b>Collocation chủ đề:</b> ${esc(e)}
<div class="row" style="margin-top:8px"><button class="btn s" id="mv">📚 Thêm ${(VB[tp]||[]).length} từ có sẵn vào sổ</button><button class="btn s" id="mw">🤖 AI thêm 8 từ</button><button class="btn s" id="mi">🤖 AI: 10 đề mới + dàn ý</button></div><div class="out" id="mo"></div></div>
<div class="card"><h3>${TOP[tp].length} đề luyện (bấm để làm)</h3>${TOP[tp].map((q,i)=>`<div class="tpl" style="padding-right:90px">${esc(q)}<button class="cp" style="top:8px;right:8px;background:var(--ac);color:#fff" onclick="useP(${i})">Làm đề ▶</button></div>`).join('')}</div>
<div class="card"><h3>Checklist sau khi viết</h3>Đã trả lời hết các câu hỏi? · Có opinion rõ ở mở bài + kết bài? · Mỗi body 1 ý chính + ví dụ cụ thể? · Không lặp từ? · Đủ 250 từ (Task 1: 150)?</div>`;
 $('#mv').onclick=e=>{const n=addVB();e.target.textContent='✓ Đã thêm '+n+' từ mới (bỏ qua từ trùng)'};
 $('#mw').onclick=e=>topV(e.target);
 $('#mi').onclick=e=>ai('Chủ đề "'+tp+'": viết 10 đề IELTS Task 2 MỚI (khác các đề phổ biến), đa dạng dạng bài (ghi rõ dạng), mỗi đề kèm 1 ý chính ngắn cho Body 1 và Body 2 phù hợp band '+BAND+'.',$('#mo'),e.target)}
$('#gb').value=BAND;$('#gb').onchange=e=>{BAND=e.target.value;store.set('band',BAND)};
if(Auth.me.role=='admin')tabs.push(['ad','👑 Quản lý']);
$('.hr').insertAdjacentHTML('afterbegin','<button class="chip" onclick="userMenu()" title="Tài khoản">👤 '+esc(Auth.me.name)+'</button>');
go('tpl');
applyTh();
</script></body></html>
